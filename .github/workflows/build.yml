name: Build Single-File EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore AsciSurvival/AsciSurvival.csproj
    
    - name: Build single-file exe (win-x64, self-contained)
      run: |
        dotnet publish AsciSurvival/AsciSurvival.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o publish
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AsciSurvival-win-x64
        path: publish/
